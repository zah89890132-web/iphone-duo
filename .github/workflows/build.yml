name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project iPhoneDuoDemo.xcodeproj \
            -scheme iPhoneDuoDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/iPhoneDuoDemo.app"
          test -d "$APP"
          rm -rf Payload iPhoneDuoDemo.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry iPhoneDuoDemo.ipa Payload
          ls -lh iPhoneDuoDemo.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneDuoDemo-IPA
          path: |
            iPhoneDuoDemo.ipa
            build/Build/Products/Release-iphoneos/iPhoneDuoDemo.app
          if-no-files-found: error

      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Latest unsigned build" \
              --notes "Automated unsigned build of \`$GITHUB_SHA\`. Sideload with AltStore / Sideloadly / ESign." \
              --prerelease
          gh release upload latest iPhoneDuoDemo.ipa --repo "$GITHUB_REPOSITORY" --clobber
